<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" width="1500" height="560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1500" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="21" font-weight="700" fill="#0f172a">Flujo batch de referencia en MapReduce: costo y requests diarios por organización y servicio</text>
  <text x="30" y="62" font-size="13" fill="#475569">Entrada: Bronze/Silver usage_events (Parquet, particionado por event_date) · Salida: Gold org_daily_usage_by_service · clave = (org_id, usage_date, service)</text>

  <g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="125" y="100">InputSplit</text>
    <text x="360" y="100">Map</text>
    <text x="610" y="100">Combiner</text>
    <text x="880" y="100">Partitioner + Shuffle/Sort</text>
    <text x="1150" y="100">Reduce</text>
    <text x="1380" y="100">OutputFormat</text>
  </g>

  <!-- splits -->
  <g font-size="12">
    <rect x="30" y="120" width="190" height="80" rx="8" fill="#fffbeb" stroke="#b45309"/>
    <text x="45" y="145" font-weight="700" fill="#78350f">split 1</text>
    <text x="45" y="165" fill="#334155">event_date=2025-07-03</text>
    <text x="45" y="183" fill="#334155">~720 eventos</text>
    <rect x="30" y="220" width="190" height="80" rx="8" fill="#fffbeb" stroke="#b45309"/>
    <text x="45" y="245" font-weight="700" fill="#78350f">split 2</text>
    <text x="45" y="265" fill="#334155">event_date=2025-07-04</text>
    <text x="45" y="283" fill="#334155">~720 eventos</text>
    <text x="125" y="330" text-anchor="middle" fill="#64748b" font-size="20">⋮</text>
    <rect x="30" y="350" width="190" height="80" rx="8" fill="#fffbeb" stroke="#b45309"/>
    <text x="45" y="375" font-weight="700" fill="#78350f">split 60</text>
    <text x="45" y="395" fill="#334155">event_date=2025-08-31</text>
    <text x="45" y="413" fill="#334155">~720 eventos</text>
  </g>

  <!-- map -->
  <g font-size="11.5">
    <rect x="260" y="120" width="200" height="310" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="275" y="145" font-weight="700" fill="#1e3a8a">map(evento) →</text>
    <text x="275" y="165" fill="#1e293b">descarta inválidos</text>
    <text x="275" y="183" fill="#1e293b">(van a quarantine)</text>
    <text x="275" y="211" font-weight="700" fill="#1e3a8a">emite:</text>
    <text x="275" y="231" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">k=(org_A,07-03,compute)</text>
    <text x="275" y="249" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">v=(cost=2.1, req=120, n=1)</text>
    <text x="275" y="275" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">k=(org_A,07-03,compute)</text>
    <text x="275" y="293" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">v=(cost=0.4, req=0,  n=1)</text>
    <text x="275" y="319" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">k=(org_B,07-03,genai)</text>
    <text x="275" y="337" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">v=(cost=14.4, req=90, n=1)</text>
    <text x="275" y="367" fill="#475569">1 tarea map por split</text>
    <text x="275" y="385" fill="#475569">(localidad de datos:</text>
    <text x="275" y="403" fill="#475569">corre donde está el bloque)</text>
  </g>

  <!-- combiner -->
  <g font-size="11.5">
    <rect x="500" y="120" width="220" height="310" rx="8" fill="#f0fdf4" stroke="#15803d"/>
    <text x="515" y="145" font-weight="700" fill="#14532d">suma parcial local</text>
    <text x="515" y="165" fill="#1e293b">(misma función que reduce:</text>
    <text x="515" y="183" fill="#1e293b">suma = asociativa)</text>
    <text x="515" y="215" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">k=(org_A,07-03,compute)</text>
    <text x="515" y="233" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">v=(2.5, 120, 2)</text>
    <text x="515" y="259" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">k=(org_B,07-03,genai)</text>
    <text x="515" y="277" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">v=(14.4, 90, 1)</text>
    <text x="515" y="315" fill="#475569">reduce lo que viaja por</text>
    <text x="515" y="333" fill="#475569">la red en el shuffle</text>
    <text x="515" y="367" fill="#475569">Spark: HashAggregate</text>
    <text x="515" y="385" fill="#475569">(partial) · reduceByKey</text>
  </g>

  <!-- shuffle -->
  <g font-size="11.5">
    <rect x="760" y="120" width="240" height="310" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="775" y="145" font-weight="700" fill="#991b1b">partición = hash(k) mod R</text>
    <text x="775" y="167" fill="#1e293b">todas las filas de una misma</text>
    <text x="775" y="185" fill="#1e293b">clave van al mismo reducer</text>
    <text x="775" y="215" fill="#1e293b">se ordenan por clave</text>
    <text x="775" y="245" font-weight="700" fill="#991b1b">paso más caro:</text>
    <text x="775" y="265" fill="#1e293b">escritura a disco + red</text>
    <text x="775" y="297" fill="#475569">Spark: Exchange</text>
    <text x="775" y="315" fill="#475569">hashpartitioning(org_id,</text>
    <text x="775" y="333" fill="#475569">event_date, service, 8)</text>
    <text x="775" y="367" fill="#475569">R = shuffle partitions</text>
    <text x="775" y="385" fill="#475569">(8 para este volumen)</text>
  </g>

  <!-- reduce -->
  <g font-size="11.5">
    <rect x="1040" y="120" width="220" height="140" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
    <text x="1055" y="145" font-weight="700" fill="#4c1d95">reducer 1</text>
    <text x="1055" y="167" fill="#1e293b">Σ cost → daily_cost_usd</text>
    <text x="1055" y="185" fill="#1e293b">Σ req → requests</text>
    <text x="1055" y="203" fill="#1e293b">Σ n → eventos</text>
    <text x="1055" y="229" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">(org_A,07-03,compute)</text>
    <text x="1055" y="246" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">→ 2.5 USD · 120 req</text>
    <rect x="1040" y="290" width="220" height="140" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
    <text x="1055" y="315" font-weight="700" fill="#4c1d95">reducer 2 … R</text>
    <text x="1055" y="337" fill="#1e293b">misma lógica sobre</text>
    <text x="1055" y="355" fill="#1e293b">otras claves</text>
    <text x="1055" y="385" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">(org_B,07-03,genai)</text>
    <text x="1055" y="402" font-family="Menlo, monospace" font-size="10.5" fill="#1e293b">→ 14.4 USD · 90 req</text>
  </g>

  <!-- output -->
  <g font-size="11.5">
    <rect x="1300" y="120" width="170" height="310" rx="8" fill="#fefce8" stroke="#a16207"/>
    <text x="1315" y="145" font-weight="700" fill="#713f12">Parquet Gold</text>
    <text x="1315" y="167" fill="#1e293b">particionado por</text>
    <text x="1315" y="185" fill="#1e293b">usage_date</text>
    <text x="1315" y="215" fill="#1e293b">1 fila por</text>
    <text x="1315" y="233" fill="#1e293b">(org, fecha, servicio)</text>
    <text x="1315" y="263" fill="#1e293b">11.050 filas con</text>
    <text x="1315" y="281" fill="#1e293b">los datos provistos</text>
    <text x="1315" y="315" fill="#475569">luego: upsert en</text>
    <text x="1315" y="333" fill="#475569">Cassandra por PK</text>
    <text x="1315" y="351" fill="#475569">((org_id), usage_date,</text>
    <text x="1315" y="369" fill="#475569">service)</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M220,160 L258,200" marker-end="url(#a)"/>
    <path d="M220,260 L258,265" marker-end="url(#a)"/>
    <path d="M220,390 L258,330" marker-end="url(#a)"/>
    <path d="M460,275 L498,275" marker-end="url(#a)"/>
    <path d="M720,275 L758,275" marker-end="url(#a)"/>
    <path d="M1000,240 L1038,195" marker-end="url(#a)"/>
    <path d="M1000,310 L1038,360" marker-end="url(#a)"/>
    <path d="M1260,190 L1298,240" marker-end="url(#a)"/>
    <path d="M1260,360 L1298,310" marker-end="url(#a)"/>
  </g>

  <rect x="30" y="460" width="1440" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="48" y="486" font-size="13" font-weight="700" fill="#0f172a">Equivalencia con Spark (validado en notebooks/01_exploracion_y_bronze.ipynb)</text>
  <text x="48" y="508" font-size="12.5" fill="#334155">bronze.rdd.map(mapper).reduceByKey(reducer)  ≡  df.groupBy("org_id","event_date","service").agg(sum, sum, count)  →  plan físico: HashAggregate(partial) → Exchange → HashAggregate(final)</text>
  <text x="48" y="528" font-size="12.5" fill="#334155">Diferencia clave: MapReduce escribe a disco entre cada job; Spark encadena etapas en memoria (DAG) y solo materializa en el shuffle → por eso el MVP se implementa en Spark.</text>
</svg>
